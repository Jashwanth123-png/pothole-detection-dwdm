# ============================================================
# REAL-TIME POTHOLE DETECTION - CONFIGURATION FILE
# ============================================================

# --- Dataset Paths ---
dataset:
  rdd2022_path: "dataset/rdd2022"          # Place RDD2022 dataset here
  raw_path: "data/raw"
  processed_path: "data/processed"
  demo_path: "data/demo"
  outputs_path: "data/outputs"
  split:
    train: 0.70
    val: 0.20
    test: 0.10

# --- Model Settings ---
model:
  yolo_model_path: "models/pothole_yolo.pt"  # Path to trained YOLO model
  yolo_base_model: "yolov8n.pt"              # Base YOLO model for training
  image_size: 416                             # Training/inference image size
  confidence_threshold: 0.20                 # Minimum detection confidence
  iou_threshold: 0.45                        # IoU threshold for NMS
  device: "cpu"                              # 'cpu' or 'cuda' or 'mps'

# --- Severity Thresholds ---
# These are project-defined thresholds, NOT official RDD2022 severity labels.
# Severity is computed from bounding-box area ratio and confidence score.
severity:
  # Bounding-box area as fraction of total image area
  area_high_threshold: 0.05    # area_ratio >= 0.05 => contributes to High
  area_low_threshold: 0.01     # area_ratio < 0.01  => contributes to Low
  # Confidence score
  conf_high_threshold: 0.70    # confidence >= 0.70 => contributes to High
  conf_low_threshold: 0.40     # confidence < 0.40  => contributes to Low
  # Final mapping: average of area_score + conf_score
  # score >= 1.5 => High, score >= 0.5 => Medium, else Low
  high_score: 1.5
  medium_score: 0.5

# --- Data Augmentation ---
augmentation:
  horizontal_flip: true
  brightness_range: [0.7, 1.3]   # Multiply pixel values by this range
  scale_range: [0.8, 1.2]        # Scale image by this range
  crop_fraction: 0.1             # Fraction to crop from edges

# --- Database ---
database:
  type: "sqlite"                          # 'sqlite' or 'mysql'
  sqlite_path: "data/warehouse.db"        # SQLite DB file path
  # MySQL settings (only used if type == 'mysql')
  mysql_host: "localhost"
  mysql_port: 3306
  mysql_user: "root"
  mysql_password: ""
  mysql_database: "pothole_dw"

# --- K-Means Clustering ---
kmeans:
  n_clusters: 3
  random_state: 42
  max_iter: 300

# --- Camera ---
camera:
  index: 0                    # Webcam device index
  frame_skip: 5               # Process every Nth frame
  save_detections_only: true  # Only store records when pothole detected

# --- Training ---
training:
  epochs: 50
  batch_size: 16
  workers: 2
  project_name: "pothole_detection"
